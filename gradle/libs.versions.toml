[versions]
agp = "9.5.0"
kotlin = "2.4.21"
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
datastore = "1.3.0"
coroutines = "1.11.0"
junit = "4.13.2"
youtubedl = "0.18.1"
serialization = "1.12.0"
heifwriter = "1.1.0"
exifinterface = "1.4.2"
androidsvg = "1.4"
commonsCompress = "1.28.0"
xz = "1.12"
libarchive = "1.1.6"
androidxTestJunit = "1.3.0"
pdfboxAndroid = "2.0.27.0"
pdfbox = "2.0.37"
androidxTestRunner = "1.7.0"

[libraries]
# Com o Kotlin embutido do AGP 9, o KGP vem como dependência do próprio AGP.
# Fixamos a versão aqui para que ela bata com a do plugin do Compose Compiler.
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# O AndroidX traz uma versão mais antiga das coroutines; fixamos a mesma para app e testes.
kotlinx-coroutines-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-bom", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test" }

androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# yt-dlp empacotado para Android (Python 3.12 + yt-dlp + QuickJS) e o ffmpeg que ele usa.
youtubedl-android = { group = "io.github.junkfood02.youtubedl-android", name = "library", version.ref = "youtubedl" }
youtubedl-android-ffmpeg = { group = "io.github.junkfood02.youtubedl-android", name = "ffmpeg", version.ref = "youtubedl" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Imagens: HEIC de saída, EXIF preservado e SVG de entrada.
androidx-heifwriter = { group = "androidx.heifwriter", name = "heifwriter", version.ref = "heifwriter" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }

# Compactados: ZIP/7Z/TAR/GZ/BZ2 em Java puro (roda nos testes) e RAR pela libarchive.
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
libarchive = { group = "me.zhanghai.android.libarchive", name = "library", version.ref = "libarchive" }

# PDF → documento: leitura de texto com posição e desenhos (Android) e o PDFBox de desktop para os testes.
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
