name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache dos APKs do LibreOffice
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/recast-libreoffice
          key: libreoffice-${{ hashFiles('gradle/libreoffice.properties') }}

      - name: Android SDK (API 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Testes, lint e build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
