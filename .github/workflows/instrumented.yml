name: Testes no emulador

# Roda os motores de conversão de verdade num emulador x86_64 (Android 15): ffmpeg,
# imagens, compactados e, como o APK x86_64 traz o LibreOffice, documentos também.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instrumented.yml"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/recast/app/data/engine/**"
      - "app/src/main/java/com/recast/app/data/convert/**"
      - "gradle/libreoffice.properties"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache dos APKs do LibreOffice
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/recast-libreoffice
          key: libreoffice-${{ hashFiles('gradle/libreoffice.properties') }}

      - name: Android SDK (API 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Testes instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Resultados (falhas no log)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, html
          files = glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          if not files:
              print('Nenhum resultado de teste encontrado (o APK nem chegou a rodar?).')
          for f in files:
              s = open(f, encoding='utf-8').read()
              m = re.search(r'tests="(\d+)" failures="(\d+)" errors="(\d+)" skipped="(\d+)"', s)
              print(f, 'testes/falhas/erros/pulados =', m.groups() if m else '?')
              for case in re.finditer(r'<testcase name="([^"]+)"[^>]*>(.*?)</testcase>', s, re.S):
                  body = case.group(2)
                  if '<failure' in body or '<error' in body:
                      print('\n### FALHOU:', case.group(1))
                      print(html.unescape(re.sub(r'<[^>]+>', '', body))[:4000])
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-emulador
          path: app/build/reports/androidTests/
