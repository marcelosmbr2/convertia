name: Testes no emulador

# Roda os motores de conversão de verdade num emulador x86_64 (Android 15): ffmpeg,
# imagens, compactados e, como o APK x86_64 traz o LibreOffice, documentos também.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/instrumented.yml"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/convertia/app/data/engine/**"
      - "app/src/main/java/com/convertia/app/data/convert/**"
      - "gradle/libreoffice.properties"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Liberar o KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache dos APKs do LibreOffice
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/convertia-libreoffice
          key: libreoffice-${{ hashFiles('gradle/libreoffice.properties') }}

      - name: Android SDK (API 37)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Testes instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 6G
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-emulador
          path: app/build/reports/androidTests/
